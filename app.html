<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Sea Paradise Team</title>
<style>
:root{--bg:#f4f5f1;--card:#fff;--ink:#1d2b27;--mut:#667570;--line:#dfe3dc;--pri:#1f4d45;--pri2:#e7efe9;--bad:#b3261e;--warn:#b26a00;--ok:#1b7a43;--info:#1a5fb4}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--ink:#e8eeea;--mut:#9aa8a1;--line:#2c3a34;--pri:#6fc3a8;--pri2:#223b33;--bad:#ff8a80;--warn:#ffb74d;--ok:#6fd49a;--info:#82b1ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Sarabun","Noto Sans Thai",system-ui,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header b{font-size:16px}header small{color:var(--mut)}header .sp{flex:1}
nav{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
nav button{white-space:nowrap}
main{padding:16px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:18px}h3{margin:14px 0 8px;font-size:15px}
button,.btn{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){button.pri{color:#10201a}}
button.tab.on{background:var(--pri2);border-color:var(--pri);font-weight:600}
button.bad{color:var(--bad)}button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);max-width:100%}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:140px}
.big{font-size:34px;font-weight:700}.mut{color:var(--mut)}.sm{font-size:13px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--pri2);color:var(--pri);white-space:nowrap}
.chip.ok{background:#e0f3e8;color:var(--ok)}.chip.late,.chip.early,.chip.working,.chip.waiting{background:#fff1dc;color:var(--warn)}
.chip.review{background:#fff1dc;color:var(--warn)}.chip.extra{background:#e0f3e8;color:var(--ok)}.chip.rejected{background:#eee;color:var(--mut)}
.chip.absent,.chip.missing_out{background:#fde3e1;color:var(--bad)}.chip.leave{background:#e3edfb;color:var(--info)}
@media (prefers-color-scheme:dark){.chip.ok{background:#1f3a2b}.chip.late,.chip.early,.chip.working,.chip.waiting{background:#3d3220}.chip.absent,.chip.missing_out{background:#43211f}.chip.leave{background:#1f2f47}}
table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap}
.gridbox{max-height:calc(100vh - 150px)!important}.brush{position:sticky;top:54px;z-index:5;background:var(--card);padding:6px 0}
.scroll{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
.grid th,.grid td{padding:0;text-align:center;border:1px solid var(--line);min-width:30px;font-size:12px}
.grid td.name,.grid th.name{position:sticky;left:0;background:var(--card);min-width:130px;text-align:left;padding:4px 8px;z-index:2;cursor:pointer}
.grid td.c{height:34px;font-size:10px;line-height:1.15;min-width:40px;cursor:pointer;user-select:none}.grid td.c.chg{outline:2px solid var(--info);outline-offset:-2px}
.grid th.hol{background:#fde3e1;color:var(--bad)}.grid th.sun{color:var(--bad)}.grid th{cursor:pointer;position:sticky;top:0;background:var(--card);z-index:1}
.grid td.hol{background:rgba(179,38,30,.06)}
.sh-M{background:#dff1e6}.sh-A{background:#fff1d6}.sh-N{background:#dfe3f7}.sh-D{background:#ece5f5}.sh-x{background:#eee}.sh-OFF{background:#fde3e1;color:var(--bad)}
@media (prefers-color-scheme:dark){.sh-OFF{background:#4a2421}.sh-M{background:#1f3a2b}.sh-A{background:#3d3220}.sh-N{background:#252b45}.sh-D{background:#2f2840}.sh-x{background:#2a2f2d}}
.brush button.on{outline:3px solid var(--pri)}
.cov-ok{color:var(--ok)}.cov-bad{color:var(--bad);font-weight:700}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
.modal>div{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:520px}
.hidden{display:none!important}
.kpi{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center;margin:6px 0}
img.pv{max-width:100%;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div class="modal" id="modal"><div id="modalBody"></div></div>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

function deviceId() {
  let d = load('dev');
  const ck = () => { try { const m = document.cookie.match(/(?:^|; )hrdev=([A-Za-z0-9-]{16,64})/); return m ? m[1] : ''; } catch (e) { return ''; } };
  if (!/^[A-Za-z0-9-]{16,64}$/.test(d)) d = ck();   // iOS อาจล้าง localStorage แต่ cookie ยังอยู่ (หรือกลับกัน)
  if (!/^[A-Za-z0-9-]{16,64}$/.test(d)) {
    d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    d = d.replace(/[^A-Za-z0-9-]/g, '');
  }
  save('dev', d);
  try { document.cookie = 'hrdev=' + d + '; max-age=63072000; path=/; SameSite=None; Secure'; } catch (e) {}
  return d;
}
function save(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function call(name, args, anon) {
  if (!API_URL) return Promise.reject(new Error('ยังไม่ได้ตั้งค่า config.js (ลิงก์ /exec ของ Apps Script)'));
  const t0 = performance.now(), done = () => { (window.TIMING = window.TIMING || []).push(name + ' ' + Math.round(performance.now() - t0) + 'ms'); if (/[?&]debug/.test(location.search)) showTiming(); };
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ rpc: name, token: anon ? null : TOKEN, args: args || [] }) })
    .then(r => { done(); return r.json(); }, () => { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสัญญาณอินเทอร์เน็ตแล้วลองใหม่'); })
    .then(j => {
      if (j && j.ok) return j.data;
      const m = String((j && j.error) || 'เกิดข้อผิดพลาด').replace(/^Error:\s*/, '');
      if (m.indexOf('AUTH') >= 0) { TOKEN = ''; save('tk', null); showLogin('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'); }
      throw new Error(m);
    });
}

// แปลภาษาพม่าเฉพาะหน้าที่เกี่ยวกับพนักงาน (ลงเวลา / ตารางของฉัน / ลา-OT / KPI ของฉัน / เข้าสู่ระบบ) — หน้าผู้จัดการ/แอดมินคงเป็นภาษาไทย
let LANG = load('lang') === 'my' ? 'my' : 'th';
const MY_KEYS = Object.keys(MY_SUB).sort((a, b) => b.length - a.length);
function myTr(str) {
  const t = str.trim(); if (!t) return str;
  if (MY_EXACT[t] !== undefined) return str.replace(t, MY_EXACT[t]);
  if (!/[฀-๿]/.test(str)) return str;
  let o = str;
  for (let i = 0; i < MY_KEYS.length; i++) { const k = MY_KEYS[i]; if (o.indexOf(k) >= 0) o = o.split(k).join(MY_SUB[k]); }
  return o;
}
function myTree(root) {
  if (!root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes = [];
  while (w.nextNode()) { const n = w.currentNode, p = n.parentNode; if (p && /^(SCRIPT|STYLE|TEXTAREA)$/.test(p.nodeName)) continue; nodes.push(n); }
  nodes.forEach(n => { const v = myTr(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; });
  (root.querySelectorAll ? root.querySelectorAll('[placeholder],[title]') : []).forEach(el => ['placeholder', 'title'].forEach(a => { const x = el.getAttribute(a); if (x) { const v = myTr(x); if (v !== x) el.setAttribute(a, v); } }));
}
const staffView = () => ['home', 'requests', 'kpi'].indexOf(CUR) >= 0 || (CUR === 'schedule' && ME && !isMgr());
let myPending = false;
function applyLang() {
  myPending = false; if (LANG !== 'my') return;
  if (!ME) { myTree($('#app')); myTree($('#toast')); return; }
  if (staffView()) { myTree($('#view')); myTree($('#modalBody')); }
  document.querySelectorAll('nav .tab').forEach(b => { if (['home', 'schedule', 'requests', 'kpi'].indexOf(b.dataset.t) >= 0) myTree(b); });
  myTree($('#toast'));
}
new MutationObserver(() => { if (LANG === 'my' && !myPending) { myPending = true; requestAnimationFrame(applyLang); } }).observe(document.body, { childList: true, subtree: true, characterData: true });
function setLang() {
  LANG = LANG === 'my' ? 'th' : 'my'; save('lang', LANG);
  if (ME) { renderShell(); go(CUR); } else showLogin();
  applyLang();
}
const langBtn = () => '<button class="lang" onclick="setLang()" style="padding:4px 10px">' + (LANG === 'my' ? 'ภาษาไทย' : 'မြန်မာ') + '</button>';

// ---------- login ----------
function showLogin(msg) {
  $('#app').innerHTML = '<main><div class="card" style="max-width:380px;margin:40px auto"><div style="float:right">' + langBtn() + '</div><h2>Sea Paradise Team</h2><div class="mut sm">ลงเวลา · ตารางงาน · ลา/OT · KPI</div>' +
    (msg ? '<p class="cov-bad sm">' + esc(msg) + '</p>' : '') +
    '<label>รหัสพนักงาน</label><input id="lid" autocomplete="username" style="width:100%"><label>PIN 6 หลัก</label><input id="lpin" type="password" inputmode="numeric" autocomplete="current-password" style="width:100%">' +
    '<p><button class="pri" style="width:100%" id="lbtn" onclick="doLogin()">เข้าสู่ระบบ</button></p></div></main>';
  $('#lpin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
}
async function doLogin() {
  await run(async () => {
    const r = await call('login', [$('#lid').value, $('#lpin').value, deviceId(), isIOS() ? 'ios' : ''], true);
    TOKEN = r.token; save('tk', TOKEN);
    await start();
    if (IDTOKEN && !BOOT.lineLinked) { try { await call('bindLine', [IDTOKEN]); toast('ผูกบัญชี LINE แล้ว'); } catch (e) {} }
  }, $('#lbtn'));
}
async function logout() { try { await call('logout'); } catch (e) {} TOKEN = ''; save('tk', null); showLogin(); }
function showTiming() {
  let d = document.getElementById('tmg'); if (!d) { d = document.createElement('div'); d.id = 'tmg'; d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#000c;color:#0f0;font:11px monospace;padding:4px 8px;z-index:99;max-height:30vh;overflow:auto'; document.body.appendChild(d); }
  d.textContent = 'เวลาตอบของเซิร์ฟเวอร์: ' + window.TIMING.join(' · ');
}
async function start() {
  const both = await Promise.all([call('bootstrap'), call('myState')]);   // ยิงพร้อมกัน 2 คำสั่ง ลดเวลารอ
  BOOT = both[0]; BOOT.url = ''; PRELOAD = both[1]; ME = BOOT.me; CUR = 'home';
  renderShell(); go('home');
}
function renderShell() {
  const tabs = [['home', 'ลงเวลา'], ['schedule', 'ตารางงาน'], ['requests', 'ลา / OT / แก้เวลา'], ['kpi', 'KPI']];
  if (isMgr()) tabs.unshift(['overview', 'ภาพรวม']), tabs.push(['report', 'รายงาน'], ['close', 'ตรวจ/ปิดรอบเดือน'], ['reward', 'เงินรางวัล']);
  if (isAdmin()) tabs.push(['balance', 'วันลาคงเหลือ'], ['admin', 'ตั้งค่า']);
  $('#app').innerHTML = '<header><b>Sea Paradise Team</b><span class="sp"></span>' + langBtn() + ' <small>' + esc(ME.name) + ' · ' + esc(ME.role === 'admin' ? 'แอดมิน' : ME.role === 'manager' ? 'ผู้จัดการ' : ME.position || 'พนักงาน') + '</small><button onclick="logout()">ออก</button></header>' +
    '<nav>' + tabs.map(t => '<button class="tab" data-t="' + t[0] + '" onclick="go(\'' + t[0] + '\')">' + esc(t[1]) + '</button>').join('') + '</nav><main id="view"></main>';
}
function go(v) {
  CUR = v;
  document.querySelectorAll('nav .tab').forEach(b => b.classList.toggle('on', b.dataset.t === v));
  ({ home: viewHome, overview: viewOverview, schedule: viewSchedule, requests: viewRequests, kpi: viewKpi, report: viewReport, close: viewClose, reward: viewReward, balance: viewBalance, admin: viewAdmin })[v]();
}

function readAttach(fl) {
  return new Promise((res, rej) => {
    if (fl.type === 'application/pdf') {
      if (fl.size > 2800000) return rej(new Error('ไฟล์แนบใหญ่เกินไป (ไม่เกิน 3 MB)'));
      const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้')); return fr.readAsDataURL(fl);
    }
    if (!/^image\//.test(fl.type)) return rej(new Error('แนบได้เฉพาะรูปภาพหรือ PDF'));
    const img = new Image(), url = URL.createObjectURL(fl);
    img.onload = () => { const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8)); };
    img.onerror = () => rej(new Error('อ่านรูปไม่ได้'));
    img.src = url;
  });
}

function csv() {
  const r = window.__rep, q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const t = '﻿' + [r.cols.map(c => q(c[1])).join(',')].concat(r.rows.map(x => r.cols.map(c => q(x[c[0]])).join(','))).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' })); a.download = 'hr-' + RM + '.csv'; a.click();
}

function offDecide(i, ok, b) {
  const o = CL.offWork[i], note = ok ? '' : (prompt('เหตุผลที่ไม่นับ (ถ้ามี)') || '');
  run(async () => { await call('offWorkDecide', [CM, o.empId, ok, note]); toast('บันทึกแล้ว'); viewClose(CM); }, b);
}
function revU(i, act, b) {
  const r = CL.review[i];
  if (act === 'reject' && !confirm('ไม่นับรายการนี้ใช่หรือไม่?')) return;
  run(async () => { await call('reviewUnsched', [r.key, act, act === 'shift' ? $('#rs' + i).value : '']); toast('บันทึกแล้ว'); viewClose(CM); }, b);
}
function fixTime(kind, i) {
  const r = kind === 'review' ? CL.review[i] : CL.missingOut[i];
  openModal('<h2>แก้เวลา: ' + esc(r.name) + ' ' + esc(dmy(r.date)) + '</h2><p class="sm mut">เข้า ' + hm(r.inAt) + ' · ออก ' + hm(r.outAt) + ' — เฉพาะแอดมิน ต้องมีเหตุผล และบันทึกประวัติ</p>' +
    '<div class="row"><div><label>เวลาเข้าใหม่ (เว้นว่างถ้าไม่แก้)</label><input id="fi" type="time"></div><div><label>เวลาออกใหม่</label><input id="fo" type="time"></div></div>' +
    '<label>เหตุผล</label><input id="fr" style="width:100%"><p><button class="pri" onclick="doFix(\'' + kind + '\',' + i + ',this)">บันทึก</button> <button onclick="closeModal()">ยกเลิก</button></p>');
}
function doFix(kind, i, b) {
  const r = kind === 'review' ? CL.review[i] : CL.missingOut[i];
  const a = r.unsched ? { key: r.key } : { empId: r.empId, date: r.date };
  run(async () => { await call('adminEditTime', [Object.assign(a, { newIn: $('#fi').value, newOut: $('#fo').value, reason: $('#fr').value })]); closeModal(); toast('แก้เวลาแล้ว'); viewClose(CM); }, b);
}
function closeP(b) {
  const ack = $('#ack') ? $('#ack').checked : true;
  if (!confirm('ปิดรอบเดือน ' + CM + ' ?\nหลังปิดจะแก้ไขเดือนนี้ไม่ได้จนกว่าจะเปิดรอบใหม่')) return;
  run(async () => { await call('periodClose', [CM, ack]); toast('ปิดรอบแล้ว'); viewClose(CM); }, b);
}
function reopenP(b) {
  const why = prompt('เหตุผลที่เปิดรอบใหม่'); if (!why) return;
  run(async () => { await call('periodReopen', [CM, why]); toast('เปิดรอบแล้ว'); viewClose(CM); }, b);
}

function tableEd(name, title, cols) {

}
function teRow(cols, r) { return '<tr data-cols="' + cols.map(c => c[0]).join(',') + '">' + cols.map(c => '<td><input data-k="' + c[0] + '" value="' + esc(r ? r[c[0]] : '') + '" style="width:100%;min-width:70px"></td>').join('') + '<td><button onclick="this.closest(\'tr\').remove()">ลบ</button></td></tr>'; }

function teAdd(n) { const t = $('#te_' + n), tr = document.createElement('tbody'); tr.innerHTML = teRow(TCOLS[n].map(k => [k]), null); t.appendChild(tr.firstChild); }
function teSave(n, b) {

sc" ' + (e.strictClock ? 'checked' : '') + '> ห้ามลงเวลาในแชต (ต้องใช้แอป: ถ่ายสด+GPS)</label><p><button class="pri" onclick="saveEmp(this)">บันทึก</button> <button onclick="closeModal()">ยกเลิก</button></p>');
  $('#e_role').value = e.role || 'staff'; $('#e_pt').value = e.payType || 'monthly'; $('#e_hr').value = e.holidayRight || 'auto';

function saveEmp(b) {
  run(async () => {
    const r = await call('saveEmployee', [{ id: $('#e_id').value, name: $('#e_name').value, dept: $('#e_dept').value, position: $('#e_pos').value, role: $('#e_role').value, baseSalary: $('#e_sal').value, payType: $('#e_pt').value, dailyRate: $('#e_dr').value, hourlyRate: $('#e_hrate').value, lateQuotaMin: $('#e_lq').value, holidayRight: $('#e_hr').value, deviceExempt: $('#e_dx').checked, lineOnly: $('#e_lo').checked, strictClock: $('#e_sc').checked, email: $('#e_mail').value, active: $('#e_act').checked }]);

    else { closeModal(); toast('บันทึกแล้ว'); viewAdmin(); }
  }, b);
}
let BY_ = String(new Date().getFullYear());

    $('#view').innerHTML = '<div class="card"><h2>วันลาคงเหลือ (เห็นเฉพาะเจ้าของ)</h2><div class="row"><div><label>ปี (ค.ศ.)</label><input type="number" value="' + esc(r.year) + '" onchange="viewBalance(this.value)"></div></div>' +
      '<p class="sm mut">สิทธิ์สะสมวันหยุดนักขัตฤกษ์ = จำนวนวันนักขัตฤกษ์ที่พนักงานมาทำงานจริง (นับจากตารางวันหยุดที่ตั้งไว้) หักด้วยวันลาประเภท “ลาใช้วันหยุด” ที่อนุมัติแล้ว · พนักงานและผู้จัดการไม่เห็นหน้านี้</p>' +
      '<div class="scroll"><table><tr><th>รหัส</th><th>ชื่อ</th><th>สิทธิ์สะสม</th><th>ได้</th><th>ใช้</th><th>คงเหลือ</th>' + r.types.filter(t => t !== 'ลาใช้วันหยุด').map(t => '<th>' + esc(t) + ' (ใช้' + (r.quotas[t] !== undefined ? '/เหลือ' : '') + ')</th>').join('') + '</tr>' +
      r.rows.map(x => '<tr><td>' + esc(x.id) + '</td><td>' + esc(x.name) + '<div class="sm mut">' + esc(x.dept) + '</div></td><td>' + (x.eligible ? '✓' : '—') + '</td><td>' + (x.eligible ? x.earned : '') + '</td><td>' + (x.eligible ? x.holidayUsed : '') + '</td><td><b>' + (x.eligible ? x.holidayBalance : '') + '</b>' + (x.eligible && x.earnedDates.length ? '<div class="sm mut">' + x.earnedDates.map(dmy).join(', ') + '</div>' : '') + '</td>' +
        r.types.filter(t => t !== 'ลาใช้วันหยุด').map(t => '<td>' + (x.used[t] || 0) + (r.quotas[t] !== undefined ? ' / ' + x.remain[t] : '') + '</td>').join('') + '</tr>').join('') + '</table></div></div>';
  });
}
function resignEmp(id) {
  const d = prompt('พนักงาน ' + id + ' ลาออก — ระบุวันทำงานวันสุดท้าย (yyyy-mm-dd)\nระบบจะปิดการเข้าระบบทันที (ลบ PIN / ผูก LINE / เครื่อง) แต่เก็บประวัติลงเวลา ใบลา KPI ไว้ครบ ตารางงานหลังวันนั้นจะถูกลบ', todayStr());
  if (!d) return;
  run(async () => { await call('resignEmployee', [id, d]); toast('บันทึกการลาออกแล้ว'); viewAdmin(); });
}
function reinstateEmp(id) { if (!confirm('รับ ' + id + ' กลับเข้าทำงาน? ระบบจะสร้าง PIN ใหม่ให้')) return; run(async () => { const r = await call('reinstateEmployee', [id]); openModal('<h2>รับกลับเข้าทำงานแล้ว</h2><p>PIN ใหม่: <b style="font-size:24px">' + esc(r.newPin) + '</b></p><p><button onclick="closeModal();viewAdmin()">ปิด</button></p>'); }); }
function showQR() {
  const url = (ST_ && ST_.liffUrl) || location.href.split('?')[0];
  if (!url) { toast('ยังไม่พบลิงก์เว็บแอป (ต้อง Deploy เป็น Web app ก่อน)'); return; }
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  const svg = q.createSvgTag({ cellSize: 8, margin: 4, scalable: true });
  openModal('<h2>QR Code ลงเวลาเข้า–ออกงาน</h2><div id="qrbox" style="max-width:320px;margin:auto">' + svg + '</div><p class="sm mut" style="word-break:break-all">' + esc(url) + '</p>' +
    '<p class="sm">สแกนด้วยกล้องมือถือ → เปิดเว็บแอป → เข้าสู่ระบบ → กดลงเวลา (ระบบยังตรวจ GPS ไม่เกิน ' + esc((BOOT && BOOT.radius) || 20) + ' ม. และถ่ายรูปสดทุกครั้ง) · พิมพ์ติดหน้าจุดลงเวลา</p>' +
    '<p><button class="pri" onclick="printQR()">พิมพ์โปสเตอร์</button> <button onclick="closeModal()">ปิด</button></p>');
}
function printQR() {
  const w = window.open('', '_blank'); if (!w) { toast('เบราว์เซอร์บล็อกหน้าต่างพิมพ์'); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><title>QR ลงเวลา</title><style>body{font-family:sans-serif;text-align:center;padding:30px}h1{font-size:44px;margin:10px}.q{width:420px;margin:20px auto}p{font-size:22px}</style><h1>สแกนเพื่อลงเวลา</h1><p>เข้างาน – เลิกงาน · Sea Paradise Team</p><div class="q">' + $('#qrbox').innerHTML + '</div><p>1) สแกน QR  2) ใส่รหัสพนักงาน + PIN  3) กด "ลงเวลา" และถ่ายรูป</p><p style="font-size:16px">ต้องอยู่ในจุดลงเวลา · ห้ามลงเวลาแทนกัน</p><script>setTimeout(function(){print()},400)<\/script>');
  w.document.close();
}
function resetDev(id) { if (!confirm('รีเซ็ตเครื่องของ ' + id + ' ? พนักงานจะล็อกอินจากมือถือเครื่องใหม่ได้ 1 เครื่อง (เครื่องแรกที่ใส่ PIN)')) return; run(async () => { await call('resetDevice', [id]); toast('รีเซ็ตเครื่องแล้ว'); viewAdmin(); }); }
function resetPin(id) { if (!confirm('รีเซ็ต PIN ของ ' + id + ' ? (จะยกเลิกการผูก LINE ด้วย)')) return; run(async () => { const r = await call('resetPin', [id]); openModal('<h2>PIN ใหม่ของ ' + esc(id) + '</h2><p class="big">' + esc(r.pin) + '</p><p class="sm mut">แสดงครั้งเดียว</p><button class="pri" onclick="closeModal()">ตกลง</button>'); }); }

// ---------- เริ่มต้น / LINE ----------
async function boot() {
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(API_URL)) {
    document.body.innerHTML = '<div style="font-family:sans-serif;padding:24px;max-width:520px;margin:auto"><h2>ยังตั้งค่าไม่ครบ</h2><p>ไฟล์ <b>config.js</b> ในโฟลเดอร์เดียวกับหน้านี้บน GitHub ยังไม่ได้ใส่ลิงก์ <b>/exec</b> ของ Apps Script (หรือไม่มีไฟล์นี้)</p><p>ให้แอดมินแก้ไฟล์ config.js ให้เป็น<br><code>window.APP_CFG = { API_URL: \'https://script.google.com/macros/s/…/exec\' };</code></p></div>';
    return;
  }
  // กันหน้าค้างว่าง: ขั้นตอน LINE ต้องจบภายใน 8 วินาที ไม่งั้นข้ามไปล็อกอินด้วย PIN
  const lim = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  let liffNote = '';
  // LIFF ทำงานในหน้า relay (ภายนอก Apps Script) แล้วส่ง ID token มาทาง ?idt=
  IDTOKEN = PRE_IDT || '';
  if (PRE_IDT) { try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  if (IDTOKEN) { try { const r = await call('lineLogin', [IDTOKEN], true); TOKEN = r.token; save('tk', TOKEN); await start(); return; } catch (e) { /* ยังไม่ผูก LINE → ล็อกอินด้วยรหัส */ } }
  TOKEN = load('tk');
  if (TOKEN) { try { await start(); return; } catch (e) { TOKEN = ''; } }
  showLogin();
  if (liffNote) { try { $('#lerr').textContent = liffNote; } catch (e) { toast(liffNote, true); } }
}
boot();
